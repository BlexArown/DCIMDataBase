version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: datacenter_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dcadmin
      POSTGRES_PASSWORD: dcpass123
      POSTGRES_DB: datacenter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./data.sql:/docker-entrypoint-initdb.d/02_data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcadmin -d datacenter"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  pgdata:
    driver: local
